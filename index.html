<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mizan">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Mizan</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0b0b0c; --card:#161618; --card2:#1d1d20; --ink:#f3efe6; --muted:#9a948a; --line:#2a2a2e;
  --gold:#d9b45a; --gold2:#b8892b; --gold-hi:#f3d98b;
  --accent:#d9b45a; --accent-ink:#141210; --soft:rgba(217,180,90,.14);
  --danger:#ef7a66; --ok:#6fd19f; --warn-bg:rgba(217,180,90,.13); --warn-ink:#f1d499; --bad-bg:rgba(239,122,102,.14); --bad-ink:#f7a797;
  --glow:0 0 0 1px rgba(217,180,90,.25), 0 6px 24px rgba(217,180,90,.18);
  --r:18px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.45;
  padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));}
body.locked{padding-bottom:0}
body.locked .tabs{display:none}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px}
h1{font-size:28px;margin:4px 0 14px;letter-spacing:-.02em}
[dir=rtl] h1{letter-spacing:0}
h2{font-size:15px;margin:24px 4px 8px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:14px}
.num{font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;flex:0 0 auto}
[dir=rtl] .flip{transform:scaleX(-1)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{margin-bottom:10px}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.warn{background:var(--warn-bg);border-color:rgba(217,180,90,.35);color:var(--warn-ink)}
.card+.card{margin-top:10px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#f0d27e 0%,#d9b45a 45%,#a8791f 100%);color:#15120c;border:0;padding:22px;box-shadow:0 10px 30px rgba(217,180,90,.25)}
.hero::after{content:"";position:absolute;inset:-40% -60%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);animation:shine 4.5s var(--ease) 1s infinite;pointer-events:none}
@keyframes shine{0%{transform:translateX(-60%)}35%,100%{transform:translateX(60%)}}
.hero .label{opacity:.85;font-size:15px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:start;cursor:pointer;transition:background .15s}
button.row:active{background:var(--card2)}
.row:last-child{border-bottom:0}
.row.static{cursor:default}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .m{font-size:13px;color:var(--muted)}
.row .v{font-weight:650;white-space:nowrap}
.row .chev{color:var(--muted);width:18px;height:18px}
.bubble{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);transition:transform .2s var(--ease)}
.row:active .bubble{transform:scale(.9) rotate(-6deg)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 16px;font:inherit;font-weight:600;cursor:pointer;background:linear-gradient(180deg,#e6c46e,#c99b3c);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),box-shadow .2s,filter .2s;box-shadow:0 4px 14px rgba(217,180,90,.18)}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:8px 12px;font-size:14px;border-radius:11px;white-space:nowrap}
.btn.small .ic{width:18px;height:18px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line);box-shadow:none}
.btn.block{width:100%;display:flex}
.btn:disabled{opacity:.45}
.two{display:flex;gap:10px}
.two>*{flex:1;min-width:0}
label.f{display:block;font-size:14px;color:var(--muted);margin:16px 4px 6px}
input,select{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;box-shadow:0 0 18px rgba(217,180,90,.2)}
input[type=date]{color-scheme:dark}
.amount{font-size:36px;font-weight:700;padding:12px 14px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font:inherit;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .15s var(--ease),background .2s,color .2s,box-shadow .2s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 14px rgba(217,180,90,.35);animation:pop .25s var(--ease)}
.chip .ic{width:18px;height:18px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:4px 0 12px;background:var(--line)}
.bar span{display:block;height:100%}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.prog span{display:block;height:100%;background:var(--c,var(--accent))}
.hbar{display:grid;grid-template-columns:minmax(70px,35%) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.hbar .tr{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.hbar .tr span{display:block;height:100%;background:var(--c,var(--accent))}
.empty{color:var(--muted);text-align:center;padding:26px 12px;font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent);vertical-align:middle}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.bad{background:var(--bad-bg);color:var(--bad-ink)}
.note{font-size:13px;color:var(--muted);margin:8px 4px 0}
.undo-strip{display:flex;align-items:center;gap:10px;background:var(--soft);color:var(--ink);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:14px}
.undo-strip .grow{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.stat{font-size:26px;font-weight:700}
.delta{font-size:13px;font-weight:600;color:var(--muted)}
.delta.up{color:var(--ok)} .delta.down{color:var(--danger)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mnav b{font-size:17px}
.seg{display:flex;background:var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:9px 4px;border-radius:10px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--gold);font-weight:600;box-shadow:0 0 0 1px rgba(217,180,90,.3)}
.pctrow{display:grid;grid-template-columns:1fr 80px 30px;gap:10px;align-items:center;padding:6px 0}
.pctrow input{padding:9px 10px;font-size:16px;text-align:end}
.pctrow .x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
details.adv>summary{list-style:none;cursor:pointer}
details.adv>summary::-webkit-details-marker{display:none}
details.adv[open]>summary .chev{transform:rotate(90deg)}
details.link summary{cursor:pointer;color:var(--accent);font-size:15px;font-weight:600;padding:8px 4px;list-style:none}
details.link summary::-webkit-details-marker{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(18,18,20,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:10}
.tab{flex:1;max-width:120px;background:none;border:0;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;transition:color .2s}
.tab .tw{width:52px;height:32px;border-radius:12px;display:grid;place-items:center;transition:background .25s var(--ease),box-shadow .25s var(--ease)}
.tab.on .tw{background:rgba(217,180,90,.16);box-shadow:0 0 18px rgba(217,180,90,.35), inset 0 0 0 1px rgba(217,180,90,.35);animation:tabpop .4s var(--ease)}
@keyframes tabpop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.tab .ic{width:24px;height:24px}
.tab.on{color:var(--gold);font-weight:700;text-shadow:0 0 12px rgba(217,180,90,.45)}
.tab.add.on{color:var(--accent);font-weight:600}
.tab.add .tw{background:linear-gradient(180deg,#e6c46e,#c99b3c);color:var(--accent-ink);box-shadow:0 4px 14px rgba(217,180,90,.3)}
.tab.add.on .tw{box-shadow:0 0 22px rgba(217,180,90,.6), inset 0 0 0 2px rgba(255,255,255,.35)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{background:var(--card);border:1px solid var(--line);border-bottom:0;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .32s var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet-bg.on .sheet{transform:none}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 14px}
.sheet h3{margin:0 0 6px;font-size:21px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px) scale(.95);background:var(--card2);color:var(--ink);border:1px solid rgba(217,180,90,.35);box-shadow:var(--glow);padding:11px 16px;border-radius:14px;font-size:15px;z-index:30;opacity:0;transition:opacity .25s,transform .3s var(--ease);pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.hidden{display:none!important}
.lock{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.lock img{width:72px;height:72px;border-radius:20px;box-shadow:0 0 30px rgba(217,180,90,.35);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.lock h1{margin:14px 0 4px}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0 26px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.f{background:var(--accent);box-shadow:0 0 10px rgba(217,180,90,.6);animation:pop .2s var(--ease)}
.dots.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center;direction:ltr}
.key{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:28px;font-weight:500;cursor:pointer}
.key.fn{background:transparent;border-color:transparent;font-size:20px;color:var(--muted)}
.key.go{background:linear-gradient(180deg,#e6c46e,#c99b3c);color:var(--accent-ink);border-color:var(--accent);font-size:24px}
.key{transition:transform .12s var(--ease),background .15s}
.key:active{background:var(--card2)}
.key:active{transform:scale(.95)}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;margin-top:22px;cursor:pointer;text-decoration:underline}

/* ---- motion ---- */
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
.enter > *{animation:rise .45s var(--ease) both}
.enter .rows > *{animation:rise .4s var(--ease) both}
.enter .prog span,.enter .bar span,.enter .hbar .tr span{transform-origin:left;animation:grow .9s var(--ease) both .15s}
[dir=rtl] .enter .prog span,[dir=rtl] .enter .bar span,[dir=rtl] .enter .hbar .tr span{transform-origin:right}
.bar span{transition:width .35s var(--ease)}
.tag{animation:pop .35s var(--ease) both}
.undo-strip{animation:rise .35s var(--ease) both}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
/* ---- add rows / pickers ---- */
.addrow .t{color:var(--gold)}
.bubble.dash{background:transparent;border:1.5px dashed rgba(217,180,90,.55);color:var(--gold)}
.chip.addchip{border-style:dashed;border-color:rgba(217,180,90,.55);color:var(--gold);background:transparent}
.chip.iconchip{padding:9px;width:44px;height:44px;justify-content:center}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid var(--card);outline:2px solid transparent;cursor:pointer;transition:transform .15s var(--ease),outline-color .2s}
.sw.on{outline-color:var(--c);transform:scale(1.1);box-shadow:0 0 14px var(--c)}
.linkish{background:none;border:0;color:var(--gold);font:inherit;font-weight:600;cursor:pointer;padding:0;text-align:start;text-decoration:underline dotted}
/* ---- sadaqah stepper ---- */
.step{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:14px}
.step .grow{flex:1}
.step .sb{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-size:22px;cursor:pointer;display:grid;place-items:center;transition:transform .12s var(--ease)}
.step .sb:active{transform:scale(.9)}
.step .sb:disabled{opacity:.35}
.step .pv{min-width:58px;text-align:center;font-weight:700;font-size:18px;color:var(--gold)}
.step.up{border-color:rgba(217,180,90,.6);box-shadow:var(--glow)}
</style>
</head>
<body class="locked">
<div class="wrap" id="app"></div>

<nav class="tabs" id="tabs">
  <button class="tab" data-v="home"><span class="tw" data-ic="home"></span><span data-t="Home"></span></button>
  <button class="tab add" data-v="add"><span class="tw" data-ic="plus"></span><span data-t="Add"></span></button>
  <button class="tab" data-v="goals"><span class="tw" data-ic="target"></span><span data-t="Goals"></span></button>
  <button class="tab" data-v="more"><span class="tw" data-ic="grid"></span><span data-t="More"></span></button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<canvas id="fx" width="0" height="0"></canvas>
<input type="file" id="importFile" accept="application/json,.json,.mizan" class="hidden">

<script>
"use strict";
/* ================= icons (simple line icons) ================= */
const IC = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
  grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  coins:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
  wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2"/><path d="M6 6l9-3 1 3"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14c2.6.4 4.5 2.8 4.5 6"/>',
  dot:'<circle cx="12" cy="12" r="6"/>',
  chart:'<path d="M4 20V11M10 20V5M16 20v-6M3 20h18"/>',
  gold:'<path d="M3 19l2.5-6h13L21 19z"/><path d="M7.5 13l2-6h5l2 6"/>',
  swap:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  shield:'<path d="M12 3l7 3v6c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V6z"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12"/><path d="M12 8C9 8 7 4 9.5 4S12 8 12 8zM12 8c3 0 5-4 2.5-4S12 8 12 8z"/>',
  car:'<path d="M5 16l1.5-5h11L19 16"/><rect x="3" y="13" width="18" height="5" rx="2"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="16.5" cy="18.5" r="1.5"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/>',
  phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  cup:'<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3v3M11 3v3"/>',
  plane:'<path d="M3 13l18-8-6 16-3-7z"/><path d="M12 14l3-3"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  game:'<rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r="1"/><circle cx="18" cy="13.5" r="1"/>',
  house:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/>'
};
const PICK_ICONS = ["heart","gift","bag","users","car","book","phone","cup","plane","game","house","star"];
const PICK_COLORS = ["#ee7fab","#ad8ff0","#f39a62","#6cc6c7","#8fb0f0","#a8d060","#f0d27e","#ef7a66"];
function ic(n, cls){ return `<svg class="ic ${cls||""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]||IC.dot}</svg>`; }
const POT_ICON = { sadaqah:"moon", savings:"coins", me:"wallet", nour:"heart", tobuy:"bag", friends:"users" };
function potIcon(p){ return p.icon || POT_ICON[p.id] || "dot"; }

const POT_NAMES = { sadaqah:"Sadaqah", savings:"Savings & gold", me:"Me", nour:"Nour", tobuy:"To-buy list", friends:"Friends outings" };
const MISSING = new Set();
function lang(){ return (state && state.settings && state.settings.lang) || localStorage.getItem("mizan.lang") || "en"; }
function t(s, v){
  let r = s;
  if(lang()==="ar"){ if(AR[s]!=null) r = AR[s]; else MISSING.add(s); }
  if(v) r = r.replace(/\{(\w+)\}/g, (m,k)=> v[k]!=null ? v[k] : m);
  return r;
}
function tr(s){ return (lang()==="ar" && AR[s]!=null) ? AR[s] : s; }
function applyLang(){
  const ar = lang()==="ar";
  document.documentElement.lang = ar ? "ar" : "en";
  document.documentElement.dir = ar ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent = t(e.dataset.t));
  document.querySelectorAll("[data-ic]").forEach(e=>{ if(!e.firstChild) e.innerHTML = ic(e.dataset.ic); });
}

/* ================= storage & crypto ================= */
const KEY_ENC = "mizan.enc.v1", KEY_PLAIN = "mizan.v1", KEY_FAILS = "mizan.fails";
const ITER = 250000;
const UNDO_MS = 10*60*1000;     // money-in entries can be undone for 10 minutes after saving
let state = null, cryptoKey = null, meta = null;
let saveChain = Promise.resolve();

const DEFAULTS = () => ({
  version: 3,
  settings: {
    lang: localStorage.getItem("mizan.lang") || "en",
    rounding: 5, lockMinutes: 2,
    gold: { every: 500, buy: 250 },
    goldPrice: null,
    nisab: { grams: 85, karat: 21 },
    sources: [],
    sourceRules: {},
    pots: [
      { id:"sadaqah", pct:10, base:"gross", color:"#e8c46a", core:true },
      { id:"savings", pct:20, base:"gross", color:"#6fa3ec", core:true },
      { id:"me",      pct:70, base:"rest",  color:"#5fcf9c", core:true }
    ]
  },
  incomes: [], spends: [], moves: [], gold: [], wishes: [], loans: [],
  zakat: { hawlStart: null },
  presetsCleared: true
});
function migrate(s){
  const d = DEFAULTS();
  for(const k of ["incomes","spends","moves","gold","wishes","loans"]) if(!Array.isArray(s[k])) s[k] = [];
  s.settings = Object.assign({}, d.settings, s.settings || {});
  for(const k of ["gold","nisab","sourceRules"]) if(!s.settings[k]) s.settings[k] = d.settings[k];
  if(!s.zakat) s.zakat = { hawlStart: null };
  s.settings.pots.forEach(p=>{ if(POT_NAMES[p.id] && !p.custom && p.name===POT_NAMES[p.id]) delete p.name; if(!POT_NAMES[p.id]) p.custom = true; });
  s.wishes.forEach(w=>{ if(!w.pot) w.pot = "me"; });
  const CMAP = {"#b0843a":"#e8c46a","#3b6aa8":"#6fa3ec","#2f7a5c":"#5fcf9c","#b8557c":"#ee7fab","#7a5cae":"#ad8ff0","#d0693b":"#f39a62",
    "#4f8a8b":"#6cc6c7","#8a6d3b":"#d6a85f","#5b7fbd":"#8fb0f0","#a0527a":"#e48ab7","#6b8e23":"#a8d060","#c0673a":"#f0935a"};
  s.settings.pots.forEach(p=>{ if(CMAP[p.color]) p.color = CMAP[p.color]; });
  s.version = 4;
  return s;
}
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pin, salt, iter){
  const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function sealWith(key, m, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj))));
  return { app:"mizan", v:1, salt:b64(m.salt), iter:m.iter, len:m.len, iv:b64(iv), ct:b64(ct) };
}
async function openWith(key, blob){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(blob.iv)}, key, unb64(blob.ct));
  return JSON.parse(dec.decode(pt));
}
function save(){
  if(!cryptoKey || !state) return;
  const snapshot = JSON.parse(JSON.stringify(state)), key = cryptoKey, m = meta;
  saveChain = saveChain.then(async ()=>{
    try{ localStorage.setItem(KEY_ENC, JSON.stringify(await sealWith(key, m, snapshot))); }
    catch(e){ toast(t("Couldn't save. Export a backup now.")); }
  });
  return saveChain;
}
function readBlob(){ try{ const r = localStorage.getItem(KEY_ENC); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function hasLegacy(){ try{ return !!localStorage.getItem(KEY_PLAIN); }catch(e){ return false; } }
if(navigator.storage && navigator.storage.persist){ try{ navigator.storage.persist(); }catch(e){} }

/* ================= one-time: remove old preset pots & sources ================= */
const PRESET_SOURCES = ["Grandmother","Dad","Aunt","Family","Eidiya","Premiere event","Other"];
const PRESET_POTS = ["nour","tobuy","friends"];
function adopt(s){
  state = migrate(s);
  if(state.presetsCleared) return;
  const b = balances(), me = state.settings.pots.find(p=>p.id==="me");
  for(const id of PRESET_POTS){
    const p = state.settings.pots.find(x=>x.id===id); if(!p) continue;
    if(Math.abs(b[id]||0) > 0.001) state.moves.push({id:uid(), date:today(), from:id, to:"me", amount:r2(b[id]), note:""});
    if(me) me.pct = r2(me.pct + (p.pct||0));
    state.removedPots = (state.removedPots||[]).concat([{id, name:POT_NAMES[id], color:p.color, icon:POT_ICON[id], custom:true}]);
    state.settings.pots = state.settings.pots.filter(x=>x.id!==id);
    state.wishes.forEach(w=>{ if(w.pot===id && !w.bought) w.pot = "me"; });
    for(const k in state.settings.sourceRules) delete state.settings.sourceRules[k][id];
  }
  state.settings.sources = state.settings.sources.filter(x=>!PRESET_SOURCES.includes(x));
  for(const k of PRESET_SOURCES) delete state.settings.sourceRules[k];
  state.presetsCleared = true;
  save();
}

/* ================= helpers ================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDays(s,n){ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/86400000); }
function r2(x){ return Math.round(x*100)/100; }
function fmt(x){ return r2(x).toLocaleString("en-US",{maximumFractionDigits:2}); }
function egp(x){ return fmt(x) + " " + t("EGP"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function num(v){ const n=parseFloat(String(v).replace(/,/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))); return isFinite(n)?n:0; }
function pot(id){ return state.settings.pots.find(p=>p.id===id) || (state.removedPots||[]).find(p=>p.id===id) || {id, name:id, color:"#888", pct:0, base:"rest", custom:true}; }

/* ================= fun: count-up & particles ================= */
function countUp(el){
  const to = +el.dataset.count, from = heroShown==null ? 0 : heroShown;
  heroShown = to;
  if(from===to || matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = egp(to); return; }
  const t0 = performance.now(), dur = 900;
  (function step(now){ const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = egp(Math.round(from+(to-from)*e)); if(k<1 && el.isConnected) requestAnimationFrame(step); else el.textContent = egp(to); })(t0);
}
function burst(kind){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#fx"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio||1, W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+"px"; cv.style.height = H+"px"; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = kind==="coins" ? ["#f3d98b","#d9b45a","#b8892b"] : ["#d9b45a","#f3d98b","#6fa3ec","#ee7fab","#5fcf9c","#ad8ff0"];
  const P = Array.from({length: kind==="coins"?46:90}, ()=>({ x: W/2 + (Math.random()-.5)*W*.5, y: kind==="coins" ? -20-Math.random()*H*.4 : H*.45,
    vx: (Math.random()-.5)*(kind==="coins"?2:11), vy: kind==="coins" ? 2+Math.random()*3 : -6-Math.random()*8, r: kind==="coins"?7+Math.random()*6:4+Math.random()*4,
    rot: Math.random()*6, vr:(Math.random()-.5)*.3, c: cols[Math.floor(Math.random()*cols.length)] }));
  const t0 = performance.now();
  (function frame(now){
    const el = now-t0; ctx.clearRect(0,0,W,H);
    for(const p of P){ p.vy += kind==="coins"?.12:.28; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, 1-el/1900);
      if(kind==="coins"){ ctx.scale(Math.abs(Math.cos(p.rot*2))*.8+.2,1); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(0,0,p.r,0,7); ctx.fill(); ctx.strokeStyle="rgba(120,80,10,.55)"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,0,p.r*.62,0,7); ctx.stroke(); }
      else { ctx.fillStyle=p.c; ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); }
      ctx.restore(); }
    if(el<1900) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); cv.width=0; cv.height=0; }
  })(t0);
}

/* ================= undo window ================= */
function undoLeft(inc){                       // ms left to undo; 0 means final
  if(!inc || !inc.createdAt) return 0;
  const age = Date.now() - inc.createdAt;
  if(age < 0) return 0;                       // clock moved back: treat as final
  return Math.max(0, UNDO_MS - age);
}
function mmss(ms){ const s=Math.ceil(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function undoable(){ return state.incomes.filter(i=>undoLeft(i)>0).sort((a,b)=>b.createdAt-a.createdAt); }
setInterval(()=>{
  if(!state) return;
  let expired = false;
  document.querySelectorAll("[data-undo]").forEach(el=>{
    const inc = state.incomes.find(i=>i.id===el.dataset.undo), left = undoLeft(inc);
    if(left<=0) expired = true; else el.textContent = mmss(left);
  });
  if(expired && !$("#sheetBg").classList.contains("on") && view!=="add") render();
}, 1000);

/* ================= split engine ================= */
function pctsFor(source){
  const rule = source && state.settings.sourceRules[source];
  const out = {}; state.settings.pots.forEach(p=> out[p.id] = rule ? (num(rule[p.id])||0) : p.pct);
  return out;
}
function computeSplit(amount, earmark, source, sadPct){
  const S = state.settings, r = S.rounding || 1, pots = S.pots, pc = pctsFor(source);
  if(sadPct!=null && sadPct>pc.sadaqah) pc.sadaqah = sadPct;   // extra sadaqah for this entry only
  const out = {}; pots.forEach(p=>out[p.id]=0);
  if(!(amount>0)) return { split: out, ear: 0, capped: false };
  const up = x=>Math.ceil(x/r-1e-9)*r, near = x=>Math.round(x/r)*r, down = x=>Math.floor(x/r+1e-9)*r;
  let left = amount;
  for(const p of pots.filter(p=>p.base==="gross")){
    let v = p.id==="sadaqah" ? up(amount*pc[p.id]/100) : near(amount*pc[p.id]/100);
    v = Math.max(0, Math.min(v, left)); out[p.id] = v; left -= v;
  }
  let ear = 0;
  if(earmark && earmark.pot && earmark.amount>0 && out.hasOwnProperty(earmark.pot)){ ear = Math.min(earmark.amount, left); out[earmark.pot] += ear; left -= ear; }
  const flex = pots.filter(p=>p.base==="rest"), tot = flex.reduce((s,p)=>s+pc[p.id],0), pool = left;
  for(const p of flex){ if(p.id==="me") continue; const v = tot ? Math.max(0, Math.min(down(pool*pc[p.id]/tot), left)) : 0; out[p.id] += v; left -= v; }
  out.me = (out.me||0) + left;
  for(const k in out) out[k] = r2(out[k]);
  return { split: out, ear: r2(ear), capped: !!(earmark && earmark.amount>ear+1e-9) };
}

/* ================= balances & derived numbers ================= */
function loanPaid(l){ return (l.pays||[]).reduce((s,p)=>s+p.amount,0); }
function balances(){
  const b = {}; state.settings.pots.forEach(p=>b[p.id]=0);
  const add=(k,v)=>{ b[k]=(b[k]||0)+v; };
  state.incomes.forEach(i=>{ for(const k in i.split) add(k, i.split[k]); });
  state.spends.forEach(s=>add(s.pot, -s.amount));
  state.moves.forEach(m=>{ add(m.from,-m.amount); add(m.to,m.amount); });
  state.gold.forEach(g=>add("savings", -g.egp));
  state.loans.forEach(l=>{ const sg = l.dir==="lent" ? -1 : 1; add(l.pot, sg*l.amount); add(l.pot, -sg*loanPaid(l)); });
  for(const k in b) b[k]=r2(b[k]);
  return b;
}
function goldStatus(){
  const G = state.settings.gold;
  const savedEver = state.incomes.reduce((s,i)=>s+(i.split.savings||0),0) + state.moves.filter(m=>m.to==="savings").reduce((s,m)=>s+m.amount,0);
  const bought = state.gold.reduce((s,g)=>s+g.egp,0);
  const dueTotal = Math.floor(savedEver/G.every + 1e-9)*G.buy;
  const cash = balances().savings;
  return { savedEver:r2(savedEver), bought:r2(bought), due:r2(Math.max(0, Math.min(dueTotal-bought, cash))), toNext:r2(G.every - (savedEver % G.every)), cash:r2(cash) };
}
function perGram(karat){ const gp = state.settings.goldPrice; return gp && gp.p21>0 ? gp.p21*(karat||21)/21 : 0; }
function goldValue(){
  let value=0, paid=0, unknown=0;
  state.gold.forEach(g=>{ paid+=g.egp; if(g.grams>0) value += g.grams*perGram(g.karat||21); else { unknown++; value += g.egp; } });
  const hasPrice = perGram(21)>0;
  return { value: hasPrice ? r2(value) : null, paid:r2(paid), unknown, hasPrice };
}
function loanTotals(){
  let owedToMe=0, iOwe=0;
  state.loans.forEach(l=>{ const left = l.amount - loanPaid(l); if(left<=0.001) return; if(l.dir==="lent") owedToMe+=left; else iOwe+=left; });
  return { owedToMe:r2(owedToMe), iOwe:r2(iOwe) };
}
function zakatStatus(){
  const N = state.settings.nisab, pg = perGram(N.karat);
  if(!(pg>0)) return { needPrice:true };
  const b = balances(), gv = goldValue();
  let cash = 0; for(const k in b) if(k!=="sadaqah") cash += b[k];
  const wealth = r2(Math.max(0,cash) + (gv.value||0)), nisab = r2(N.grams*pg), above = wealth >= nisab;
  const hs = state.zakat.hawlStart, dueDate = hs ? addDays(hs, 354) : null;
  return { wealth, nisab, above, hawlStart:hs, dueDate, due: !!(above && dueDate && today() >= dueDate), daysLeft: dueDate ? daysBetween(today(), dueDate) : null, amount: Math.ceil(wealth*0.025) };
}
function ensureHawl(){ const z = zakatStatus(); if(!z.needPrice && z.above && !state.zakat.hawlStart){ state.zakat.hawlStart = today(); save(); } }
function inflowPerDay(potId){
  if(!state.incomes.length) return 0;
  const first = state.incomes.map(i=>i.date).sort()[0];
  const from = addDays(today(), -90) > first ? addDays(today(), -90) : first;
  let sum = 0;
  state.incomes.forEach(i=>{ if(i.date>=from) sum += (i.split[potId]||0); });
  state.moves.forEach(m=>{ if(m.date>=from){ if(m.to===potId) sum+=m.amount; if(m.from===potId) sum-=m.amount; } });
  return Math.max(0, sum/Math.max(30, daysBetween(from, today())+1));
}

function bindAdd(){
  const amt=$("#aAmt"), earPot=$("#aEarPot"), earAmt=$("#aEarAmt"), note=$("#aNote"), date=$("#aDate");
  const sync=()=>{ addDraft.amount=amt.value; addDraft.earPot=earPot.value; addDraft.earAmt=earAmt.value; addDraft.note=note.value; addDraft.date=date.value||today(); preview(); };
  [amt,earPot,earAmt,note,date].forEach(e=>{ e.addEventListener("input",sync); e.addEventListener("change",sync); });
  document.querySelectorAll("#aSrc .chip[data-i]").forEach(c=>c.onclick=()=>{ addDraft.source=state.settings.sources[+c.dataset.i]; document.querySelectorAll("#aSrc .chip[data-i]").forEach(x=>x.classList.toggle("on",x===c)); preview(); });
  $("#aSave").onclick=saveIncome;
  $("#aSadPlus").onclick=()=>{ addDraft.sadPct = Math.min(100, sadNow()+5); preview(true); };
  $("#aSadMinus").onclick=()=>{ const b=sadBase(); addDraft.sadPct = Math.max(b, sadNow()-5); if(addDraft.sadPct<=b) addDraft.sadPct=null; preview(true); };
  preview();
  if(!addDraft.amount) setTimeout(()=>amt.focus(),50);
}
function sadBase(){ return pctsFor(addDraft.source).sadaqah; }
function sadNow(){ const b=sadBase(); return addDraft.sadPct!=null && addDraft.sadPct>b ? addDraft.sadPct : b; }
function draftEarmark(){ const a=num(addDraft.earAmt); return (addDraft.earPot && a>0) ? {pot:addDraft.earPot, amount:a} : null; }
function preview(bump){
  const a = num(addDraft.amount), box=$("#aPreview"), btn=$("#aSave");
  const base = sadBase(); if(addDraft.sadPct!=null && addDraft.sadPct<=base) addDraft.sadPct=null;
  const sp = sadNow(), extra = sp>base;
  $("#aSadPct").textContent = sp+"%"; $("#aSadMinus").disabled = !extra;
  $("#aSad").classList.toggle("up", extra); if(bump){ const e=$("#aSadPct"); e.style.animation="none"; void e.offsetWidth; e.style.animation="pop .3s"; }

  btn.textContent = !(a>0) ? t("Type the amount") : (!addDraft.source ? t("Who is it from?") : t("Save"));

  const ear = draftEarmark(), {split, ear:e, capped} = computeSplit(a, ear, addDraft.source, extra?sp:null);

  $("#aSadWarn").innerHTML = extra ? `<div class="card warn" style="margin-top:10px;display:flex;gap:10px;align-items:flex-start">${ic("moon")}<div><b>${t("Extra sadaqah this time")}</b><div style="font-size:14px;margin-top:2px">${a>0?t("{x} instead of {y}. The other pots get less from this money only. Next time it's back to {p}%.",{x:egp(split.sadaqah), y:egp(normal), p:base}):t("Only this money is affected. Next time it's back to {p}%.",{p:base})}</div></div></div>` : "";
  if(!(a>0)){ box.innerHTML=""; return; }
  box.innerHTML = `<div class="card">${splitBar(split,a)}${splitList(split, ear?{pot:ear.pot,amount:e}:null)}

function splitBar(split,total){ return `<div class="bar">${state.settings.pots.filter(p=>split[p.id]>0).map(p=>`<span style="background:${p.color};width:${split[p.id]/total*100}%"></span>`).join("")}</div>`; }

/* ================= GOALS ================= */
function goalStatus(w, b){
  const open = state.wishes.filter(x=>!x.bought && x.pot===w.pot);
  let cum = 0; for(const x of open){ cum += x.price; if(x.id===w.id) break; }
  const bal = Math.max(0, b[w.pot]||0);
  const covered = Math.max(0, Math.min(w.price, bal - (cum - w.price)));
  const remaining = r2(Math.max(0, cum - bal));
  const res = { covered, remaining, pct: w.price>0 ? covered/w.price*100 : 100 };
  if(remaining<=0){ res.kind="ready"; return res; }
  const rate = inflowPerDay(w.pot);
  res.eta = rate>0 ? addDays(today(), Math.ceil(remaining/rate)) : null;
  if(!w.due){ res.kind="nodate"; return res; }
  const daysLeft = daysBetween(today(), w.due);
  if(daysLeft<0){ res.kind="late"; return res; }
  if(res.eta && res.eta<=w.due){ res.kind="ontrack"; return res; }
  res.kind="behind"; res.extra = Math.ceil(Math.max(0, remaining/(Math.max(daysLeft,1)/30.4) - rate*30.4)/5)*5;
  return res;
}

/* ================= REPORT ================= */
function monthStats(mk){
  const inc = state.incomes.filter(i=>monthKey(i.date)===mk);
  const bySrc = {}; inc.forEach(i=>bySrc[i.source]=(bySrc[i.source]||0)+i.amount);
  const byPot = {}; let gave=0, zakat=0, spent=0;
  state.spends.filter(s=>monthKey(s.date)===mk).forEach(s=>{ if(s.type==="reset") return; if(s.type==="give") gave+=s.amount; else if(s.type==="zakat") zakat+=s.amount; else { spent+=s.amount; byPot[s.pot]=(byPot[s.pot]||0)+s.amount; } });
  let saved = inc.reduce((a,i)=>a+(i.split.savings||0),0);
  state.moves.filter(m=>monthKey(m.date)===mk).forEach(m=>{ if(m.to==="savings") saved+=m.amount; if(m.from==="savings") saved-=m.amount; });
  const gold = state.gold.filter(g=>monthKey(g.date)===mk);
  return { in:r2(inc.reduce((a,i)=>a+i.amount,0)), bySrc, spent:r2(spent), byPot, gave:r2(gave), zakat:r2(zakat), saved:r2(saved), goldEgp:r2(gold.reduce((a,g)=>a+g.egp,0)) };
}
function deltaTag(cur, prev, goodUp){
  if(!prev && !cur) return "";
  if(!prev) return `<div class="delta">${t("First month")}</div>`;
  const d = cur-prev;
  if(Math.abs(d)<0.005) return `<div class="delta">${t("Same as last month")}</div>`;
  const good = goodUp ? d>0 : d<0;
  return `<div class="delta ${good?"up":"down"}">${d>0?"▲":"▼"} ${fmt(Math.abs(d))} ${t("vs last month")}</div>`;
}
function vReport(){
  if(!reportMonth) reportMonth = monthKey(today());
  const mk = reportMonth, cur = monthStats(mk), prev = monthStats(shiftMonth(mk,-1));
  const bars = (entries, colorOf, label) => { const mx = Math.max(1, ...entries.map(x=>x[1])); return entries.map(([k,v])=>`<div class="hbar" style="--c:${colorOf(k)}"><span>${esc(label(k))}</span><span class="tr"><span style="width:${v/mx*100}%"></span></span><span class="num">${fmt(v)}</span></div>`).join(""); };
  const src = Object.entries(cur.bySrc).sort((a,b)=>b[1]-a[1]), pots = Object.entries(cur.byPot).sort((a,b)=>b[1]-a[1]);
  const isNow = mk >= monthKey(today());
  return `${pageTop(t("Monthly report"))}
  <div class="mnav"><button class="iconbtn" aria-label="${esc(t("Previous month"))}" onclick="reportMonth=shiftMonth(reportMonth,-1);render()">${ic("back","flip")}</button><b>${monthName(mk)}</b><button class="iconbtn" aria-label="${esc(t("Next month"))}" ${isNow?"disabled style='opacity:.35'":""} onclick="reportMonth=shiftMonth(reportMonth,1);render()">${ic("chev","flip")}</button></div>
  <div class="card"><div class="sub">${t("Came in")}</div><div class="stat num">${egp(cur.in)}</div>${deltaTag(cur.in, prev.in, true)}

  <div class="card"><div class="sub">${t("Saved")}</div><div class="stat num">${egp(cur.saved)}</div>${deltaTag(cur.saved, prev.saved, true)}

function delItem(coll,id){
  if(coll==="incomes") return;   // money-in entries only go through the undo window
  if(!confirm(t("Delete this entry?"))) return;
  const w = coll==="spends" ? state.spends.find(s=>s.id===id) : null;
  if(w && w.type==="wish" && w.wishId){ const it=state.wishes.find(x=>x.id===w.wishId); if(it){ it.bought=false; delete it.boughtDate; delete it.paid; } }
  state[coll] = state[coll].filter(x=>x.id!==id); save(); render(); toast(t("Deleted."));
}

/* ================= BACKUP ================= */
function download(text, name){
  const blob = new Blob([text],{type:"application/json"}), file = new File([blob], name, {type:"application/json"});
  if(navigator.canShare && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:"Mizan"}).catch(()=>{}); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast(t("Saved to your Downloads."));
}
async function exportData(readable){
  if(readable){ if(!confirm(t("Anyone who opens this file can read your data. Continue?"))) return; download(JSON.stringify(state,null,1), `mizan-unlocked-${today()}.json`); }
  else download(JSON.stringify(await sealWith(cryptoKey, meta, state)), `mizan-backup-${today()}.mizan`);
}
$("#importFile").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    e.target.value="";
    let obj; try{ obj=JSON.parse(rd.result); }catch(err){ return alert(t("This isn't a Mizan backup.")); }
    if(obj && obj.ct && obj.salt){
      if(meta && obj.salt===b64(meta.salt)){ try{ return confirmImport(await openWith(cryptoKey, obj)); }catch(err){} }
      return sheetBackupPin(obj);
    }
    if(obj && obj.settings && Array.isArray(obj.incomes)) return confirmImport(obj);
    alert(t("This isn't a Mizan backup."));
  };
  rd.readAsText(f);
});
function confirmImport(s){
  if(!confirm(t("Replace everything here with this backup?"))) return;
  adopt(s); save(); go("home"); toast(t("Backup restored."));
}
function sheetBackupPin(obj){
  openSheet(`<h3>${t("Backup PIN")}</h3><div class="sub">${t("This backup uses a different PIN.")}</div>
    <input id="bpPin" type="password" inputmode="numeric" autocomplete="off" style="margin-top:12px;font-size:24px;letter-spacing:6px;text-align:center" autofocus>
    <div class="two" style="margin-top:16px"><button class="btn ghost" onclick="closeSheet()">${t("Cancel")}</button><button class="btn" id="bpGo">${t("Open")}</button></div>`);
  $("#bpGo").onclick = async ()=>{
    try{ const k = await deriveKey($("#bpPin").value, unb64(obj.salt), obj.iter||ITER); const s = await openWith(k, obj); closeSheet(); confirmImport(s); }
    catch(err){ toast(t("Wrong PIN.")); }
  };
}

function doRepay(id){
  const l=state.loans.find(x=>x.id===id), left=r2(l.amount-loanPaid(l)), a=num($("#rAmt").value);
  if(!(a>0)) return toast(t("Type the amount.")); if(a>left+1e-9) return toast(t("That's more than what's left."));
  l.pays=(l.pays||[]).concat([{id:uid(),date:today(),amount:r2(a)}]); save(); closeSheet(); render();
  toast(a>=left-1e-9 ? t("Fully paid.") : t("Saved.")); if(a>=left-1e-9) burst("confetti");
}
function delLoan(id){ if(!confirm(t("Delete this loan?"))) return; state.loans=state.loans.filter(l=>l.id!==id); save(); closeSheet(); render(); }
function sheetRule(i){
  const S=state.settings, src=S.sources[i], rule=S.sourceRules[src];
  openSheet(`<h3>★ ${esc(tr(src))}</h3><div class="sub">${t("Used only for money from {s}.",{s:esc(tr(src))})}</div>
    <div id="ruleRows" style="margin-top:10px">${S.pots.map(p=>`<div class="pctrow"><div style="display:flex;align-items:center;gap:8px"><span style="color:${p.color};display:flex">${ic(potIcon(p))}</span>${esc(potName(p))}</div>
      <input inputmode="decimal" data-p="${p.id}" value="${rule?num(rule[p.id]):p.pct}" oninput="ruleSum()"><span class="sub">%</span></div>`).join("")}</div>
    <div class="note" id="ruleSum"></div>
    ${btns(t("Save"), `doRule(${i})`)}
    ${rule?`<button class="btn block ghost" style="margin-top:10px" onclick="delRule(${i})">${t("Back to normal split")}</button>`:""}`);
  ruleSum();
}
function ruleSum(){ let s=0; document.querySelectorAll("#ruleRows input").forEach(x=>s+=num(x.value)); const e=$("#ruleSum"); const bad=Math.abs(s-100)>0.001; e.textContent=t("Total: {x}%",{x:fmt(s)})+(bad?" "+t("(must be 100%)"):" ✓"); e.style.color=bad?"var(--danger)":""; return s; }
function doRule(i){
  if(Math.abs(ruleSum()-100)>0.001) return toast(t("Total must be 100%."));
  const r={}; document.querySelectorAll("#ruleRows input").forEach(x=>r[x.dataset.p]=num(x.value));
  state.settings.sourceRules[state.settings.sources[i]]=r; save(); closeSheet(); render(); toast(t("Saved."));
}
function delRule(i){ delete state.settings.sourceRules[state.settings.sources[i]]; save(); closeSheet(); render(); }
function sheetZakat(){
  const z=zakatStatus();
  openSheet(`<h3>${t("I paid zakat")}</h3>
    <input id="zAmt" class="amount num" inputmode="decimal" value="${z.amount}" autofocus style="margin-top:8px">
    <label class="f">${t("Taken from")}</label>${potChips("zPot","savings", p=>p.id!=="sadaqah")}
    ${btns(t("Save"), "doZakat()")}`);
}
function doZakat(){
  const a=num($("#zAmt").value); if(!(a>0)) return toast(t("Type the amount."));
  state.spends.push({id:uid(),date:today(),pot:chipVal("zPot"),amount:r2(a),note:"",type:"zakat"});
  state.zakat.hawlStart = today(); save(); closeSheet(); render(); toast(t("May it be accepted."));
}
function sheetHawl(){
  openSheet(`<h3>${t("Zakat year start")}</h3><div class="sub">${t("The day your money first reached nisab, or the day you last paid zakat.")}</div>
    <input id="hDate" type="date" style="margin-top:12px" value="${state.zakat.hawlStart||today()}">
    ${btns(t("Save"), "doHawl()")}`);
}
function doHawl(){ state.zakat.hawlStart=$("#hDate").value||null; save(); closeSheet(); render(); }
function sheetChangePin(){
  openSheet(`<h3>${t("Change PIN")}</h3>
    <label class="f">${t("Current PIN")}</label><input id="cp0" type="password" inputmode="numeric" autocomplete="off" autofocus>
    <label class="f">${t("New PIN (4–6 digits)")}</label><input id="cp1" type="password" inputmode="numeric" autocomplete="off">
    <label class="f">${t("New PIN again")}</label><input id="cp2" type="password" inputmode="numeric" autocomplete="off">
    ${btns(t("Change"), "doChangePin()")}`);
}
async function doChangePin(){
  const a=$("#cp0").value, b=$("#cp1").value, c=$("#cp2").value;
  try{ const k=await deriveKey(a, meta.salt, meta.iter); await openWith(k, readBlob()); }catch(e){ return toast(t("Current PIN is wrong.")); }
  if(!/^\d{4,6}$/.test(b)) return toast(t("PIN must be 4 to 6 digits."));
  if(b!==c) return toast(t("The new PINs don't match."));
  await setNewPin(b); closeSheet(); toast(t("PIN changed."));
}

/* ================= LOCK / UNLOCK ================= */
let padBuf = "", padHandler = null, padMax = 6, padAuto = false;
function padHTML(title, sub, extra){
  return `<div class="lock"><img src="apple-touch-icon.png" alt="" onerror="this.style.display='none'">
    <h1>${title}</h1><div class="sub" style="max-width:300px">${sub}</div>
    <div class="dots" id="dots"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join("")}
      <button class="key fn" data-k="del" aria-label="Delete">⌫</button><button class="key" data-k="0">0</button><button class="key go ${padAuto?"hidden":""}" data-k="ok" aria-label="OK">✓</button></div>
    ${extra||""}</div>`;
}
function drawDots(){ const d=$("#dots"); if(!d) return; const n = padAuto ? padMax : Math.max(4, padBuf.length); d.innerHTML = Array.from({length:n},(_,i)=>`<i class="${i<padBuf.length?"f":""}"></i>`).join(""); }
function padKey(k){
  if(!padHandler) return;
  if(k==="del"){ padBuf=padBuf.slice(0,-1); drawDots(); return; }
  if(k==="ok"){ if(padBuf.length>=4) padHandler(padBuf); return; }
  if(/^\d$/.test(k) && padBuf.length<padMax){ padBuf+=k; drawDots(); if(padAuto && padBuf.length===padMax) setTimeout(()=>padHandler(padBuf),120); }
}
document.addEventListener("keydown", e=>{
  if(!padHandler || !document.body.classList.contains("locked")) return;
  if(/^\d$/.test(e.key)) padKey(e.key); else if(e.key==="Backspace") padKey("del"); else if(e.key==="Enter") padKey("ok");
});
function shakeDots(){ const d=$("#dots"); if(d){ d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); } padBuf=""; drawDots(); }
function showPad(title, sub, handler, opts){
  document.body.classList.add("locked"); closeSheet(); applyLang();
  padMax = (opts&&opts.len) || 6; padAuto = !!(opts&&opts.len); padHandler = handler;
  $("#app").innerHTML = padHTML(title, sub, opts&&opts.extra);
  document.querySelectorAll(".key").forEach(k=>k.onclick=()=>padKey(k.dataset.k));
  padBuf=""; drawDots();
}
function noCrypto(){ document.body.classList.add("locked"); $("#app").innerHTML = `<div class="lock"><h1>${t("Mizan")}</h1><div class="sub">${t("Open Mizan from its file on your laptop, or its icon on your phone.")}</div></div>`; }
function showSetup(){
  if(!window.crypto || !crypto.subtle) return noCrypto();
  const legacy = hasLegacy();
  showPad(t("Choose a PIN"), t("4 to 6 digits, then press ✓."), pin=>{
    const first = pin;
    showPad(t("Type it again"), "", async pin2=>{
      if(pin2!==first){ toast(t("They didn't match. Try again.")); return showSetup(); }
      let data = DEFAULTS();
      state = data; await setNewPin(first);
      if(legacy){ try{ adopt(JSON.parse(localStorage.getItem(KEY_PLAIN))); await save(); }catch(e){} }
      try{ localStorage.removeItem(KEY_PLAIN); }catch(e){}
      padHandler=null; startSession(); toast(t("Done. Don't forget your PIN."));
    }, {len:first.length});
  });
}
async function setNewPin(pin){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  cryptoKey = await deriveKey(pin, salt, ITER); meta = { salt, iter:ITER, len:pin.length };
  await save();
}
function fails(){ try{ return JSON.parse(localStorage.getItem(KEY_FAILS))||{n:0,until:0}; }catch(e){ return {n:0,until:0}; } }
function setFails(f){ try{ localStorage.setItem(KEY_FAILS, JSON.stringify(f)); }catch(e){} }
function showUnlock(){
  if(!window.crypto || !crypto.subtle) return noCrypto();
  const blob = readBlob();
  showPad(t("Mizan"), t("Enter your PIN"), async pin=>{
    const f = fails();
    if(Date.now() < f.until){ shakeDots(); return toast(t("Too many tries. Wait {n} seconds.",{n:Math.ceil((f.until-Date.now())/1000)})); }
    try{
      const salt = unb64(blob.salt), key = await deriveKey(pin, salt, blob.iter||ITER), s = await openWith(key, blob);
      cryptoKey = key; meta = { salt, iter: blob.iter||ITER, len: blob.len||pin.length };
      adopt(s); setFails({n:0,until:0}); padHandler=null; startSession();
    }catch(e){
      f.n++; if(f.n>=5) f.until = Date.now() + 30000*Math.pow(2, f.n-5); setFails(f);
      shakeDots(); toast(f.n>=5 ? t("Wrong PIN. Wait {n} seconds.",{n:Math.round(30*Math.pow(2,f.n-5))}) : t("Wrong PIN."));
    }
  }, { len: blob.len || 0, extra:`<button class="linkbtn" onclick="forgotPin()">${t("Forgot PIN?")}</button>` });
  if(!blob.len){ padAuto=false; padMax=6; const ok=document.querySelector(".key.go"); if(ok) ok.classList.remove("hidden"); drawDots(); }
}
function forgotPin(){
  if(!confirm(t("Without the PIN your data can't be opened. Erase everything and start again?"))) return;
  if(!confirm(t("Are you sure? This can't be undone."))) return;
  try{ localStorage.removeItem(KEY_ENC); localStorage.removeItem(KEY_FAILS); }catch(e){}
  showSetup();
}
let lastActive = Date.now(), hiddenAt = 0;
function lockApp(){ if(!state) return; save(); state=null; cryptoKey=null; closeSheet(); showUnlock(); }
function startSession(){ lastActive = Date.now(); heroShown = null; go("home"); }
["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev, ()=>{ lastActive=Date.now(); }, {passive:true}));
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(state && hiddenAt && Date.now()-hiddenAt > state.settings.lockMinutes*60000) lockApp();
});
setInterval(()=>{ if(state && Date.now()-lastActive > state.settings.lockMinutes*60000) lockApp(); }, 10000);

/* ================= boot ================= */
document.querySelectorAll(".tab").forEach(tb=>tb.onclick=()=>go(tb.dataset.v));
applyLang();
if(readBlob()) showUnlock(); else showSetup();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
